# Nginx configuration for SecureShareFR
# Handles HTTPS termination, HTTP→HTTPS redirect, reverse proxy to API & Authority,
# and static React app serving.
#
# For LOCAL DOCKER (self-signed cert):   nginx/certs/server.crt + server.key
# For PRODUCTION (Let's Encrypt):        replace cert paths with /etc/letsencrypt/live/DOMAIN/

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security
    server_tokens   off;

    # Timeouts for large file uploads (100 MiB default)
    client_max_body_size    110m;
    client_body_timeout     120s;
    proxy_read_timeout      120s;
    proxy_send_timeout      120s;
    proxy_connect_timeout   10s;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # TLS certificates (self-signed for local dev; swap for Let's Encrypt in prod)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS hardening
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-Frame-Options            "DENY" always;
        add_header Referrer-Policy            "no-referrer" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Proxy headers forwarded to backend
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # ── Swagger UI (/docs) ───────────────────────────────────────────────
        location = /docs {
            proxy_pass http://api:4000/docs;
        }
        location = /api/openapi.json {
            proxy_pass http://api:4000/api/openapi.json;
        }

        # ── API backend (/api/*) ─────────────────────────────────────────────
        location /api/ {
            client_max_body_size    110m;      # large file uploads
            proxy_request_buffering off;       # stream uploads directly
            proxy_pass              http://api:4000;
            proxy_buffering         off;
        }

        # ── Attribute authority (/authority/*) ───────────────────────────────
        location /authority/ {
            client_max_body_size    64k;
            proxy_pass              http://authority:7000;
        }

        # ── Static React SPA (everything else) ───────────────────────────────
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # Content Security Policy (same as Caddy: no inline scripts, no eval, no third-party)
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

            # Cache immutable Vite assets
            location ~* ^/assets/ {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }
    }
}
